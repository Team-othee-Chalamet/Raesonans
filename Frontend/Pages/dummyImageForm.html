<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="submit" id="form">
        <input type="file" name="file" id="file">
        <br>
        Skal dette billede vises i galleriet?<input name="galleryVis" id="galleryVis" type="checkbox">
        <br>
        Skal dette tilføjes til et teaterstykke med det samme?<select name="playDropDown" id="playDropDown">
            <option value="none">vælg teaterstykke</option>
            <option value="nemt">NEMT</option>
            <option value="støj">Støj</option>
        </select>
        <br>
        Skal dette billede sættes som splash image til den pågældende forestilling? <input type="checkbox" name="setSplash" id="setSplash">
        <br>
        <button type="submit" id="saveImageButton">send</button>
    </form>

    <script type="module" src="../Scripts/sendImage.js"></script>
</body>
</html>
